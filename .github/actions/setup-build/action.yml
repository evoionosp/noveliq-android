name: Setup Noveliq build
description: >-
  Provisions the exact JDKs this project needs, plus a cached Gradle installation.
  The caller must run actions/checkout first — GitHub cannot resolve a local
  composite action until the repository is on disk.

inputs:
  cache-read-only:
    description: Only read the Gradle cache, do not write it back.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # One JDK for everything: the Gradle daemon (pinned in
    # gradle/gradle-daemon-jvm.properties), the compile toolchain
    # (kotlin { jvmToolchain(21) }) and the bytecode target (compileOptions) are all 21.
    # Keeping them equal means Gradle never provisions a toolchain from api.foojay.io.
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-read-only: ${{ inputs.cache-read-only }}
        # Surfaces deprecations and a per-job build scan link in the run summary.
        add-job-summary: on-failure
        validate-wrappers: true
