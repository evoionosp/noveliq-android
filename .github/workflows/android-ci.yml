name: Android CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant. Cancel it.
# Never cancel on master: those runs are the release history.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  # The whole build runs on a single JDK 17, so Gradle needs no help locating a
  # second toolchain.
  GRADLE_ARGS: --stacktrace

jobs:
  # ---------------------------------------------------------------------------
  # Formatting + Android Lint. Independent of everything else, so it runs first
  # in wall-clock terms but gates nothing.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        # This job does not need to seed the cache; unit-tests does that.
        with:
          cache-read-only: true

      - name: ktlint
        run: ./gradlew $GRADLE_ARGS ktlintCheck

      - name: Android Lint
        # Runs even when ktlint failed — seeing both problem sets in one run beats
        # a second round trip.
        if: ${{ !cancelled() }}
        run: ./gradlew $GRADLE_ARGS :app:lintDebug

      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Unit tests + coverage. This is the job that matters for the 90% goal.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      # koverXmlReport/koverHtmlReport do NOT depend on the unit test tasks, so the
      # tests must be requested explicitly first: without testDebugUnitTest there are
      # no Kover binaries and the aggregated report comes out empty (0/0 lines).
      # koverVerify enforces the floors declared in settings.gradle.kts.
      - name: Run unit tests with coverage
        run: ./gradlew $GRADLE_ARGS testDebugUnitTest koverXmlReport koverHtmlReport koverVerify

      - name: Summarise test results
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py tests

      - name: Summarise coverage
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/ci_summary.py coverage

      - name: Comment coverage on pull request
        # Best-effort: never fail the build over a comment.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci_summary.py comment "${{ github.event.number }}"

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/reports/kover/html/**
            build/reports/kover/report.xml
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Does it actually build. Parallel with the two jobs above, not chained behind
  # them — a compile break and a lint break are independent facts.
  # ---------------------------------------------------------------------------
  assemble:
    name: Assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: true

      - name: Assemble debug
        run: ./gradlew $GRADLE_ARGS assembleDebug

      # Only on master: exercises R8/shrinking, which is where release-only
      # breakage (missing keep rules) shows up. Falls back to debug signing when
      # keystore.properties is absent, which it always is in CI.
      - name: Assemble release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: ./gradlew $GRADLE_ARGS assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn
