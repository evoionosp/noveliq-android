#
# The JDK that runs the Gradle daemon.
#
# Kept deliberately equal to the compile toolchain (kotlin { jvmToolchain(21) }) and to
# compileOptions in every module. AGP checks at execution time that Kotlin's jvmTarget
# equals compileOptions.targetCompatibility and fails with "Inconsistent JVM targets"
# if they differ, so these three numbers move together or not at all.
#
# One version everywhere also means Gradle never provisions a second JDK from
# api.foojay.io, which is slow and, on some networks, blocked outright.
#
# 21 is above AGP 9's minimum of 17 and is what AGP 10 will require, so this does not
# need revisiting at the next major. D8 accepts Java 21 bytecode.
#
# Regenerate with: ./gradlew updateDaemonJvm --jvm-version=21
#
# NOTE: the generated toolchainUrl.* auto-download entries are intentionally omitted.
# Gradle resolves JDK 21 from locally detected installations instead — see the
# "Toolchains" section of README.md if `./gradlew` cannot find one from the terminal.
toolchainVersion=21
